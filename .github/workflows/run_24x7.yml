name: 24x7 Telegram to Google Drive Downloader

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: tg-gdrive-downloader
  cancel-in-progress: true

permissions: write-all

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram to Google Drive Pipeline
        env:
          PYTHONUNBUFFERED: "1"
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: |
          python -u downloader.py

      - name: Auto Retrigger Next Workflow
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Ensuring 24x7 continuous loop via GitHub Actions API..."
          gh workflow run run_24x7.yml || echo "Auto-trigger queued via cron schedule."
