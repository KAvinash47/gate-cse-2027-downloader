name: 24x7 Telegram to Google Drive Downloader

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: tg-gdrive-downloader
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram to Google Drive Pipeline
        env:
          PYTHONUNBUFFERED: "1"
          TG_API_ID: ${{ secrets.TG_API_ID || '38656404' }}
          TG_API_HASH: ${{ secrets.TG_API_HASH || 'f2cd910275c392039b0864c1dadd47f2' }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TG_GROUP_ID: ${{ secrets.TG_GROUP_ID || '-1003610973355' }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_ROOT_FOLDER_ID: '1LjiY-Y-68Jvcp8Bs62RuNjJDJwD90OzC'
        run: |
          python -u downloader.py

      - name: Auto Retrigger Next Workflow
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Ensuring 24x7 continuous loop via GitHub Actions API..."
          gh workflow run run_24x7.yml --repo ${{ github.repository }} || true
